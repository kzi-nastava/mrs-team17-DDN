<nav class="navbar">
  <div class="nav-left">
    <a class="nav-link" routerLink="/driver/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>

    <a class="nav-link" routerLink="/driver/active-ride" routerLinkActive="active">
      Active Ride
    </a>

    <a class="nav-link" routerLink="/driver/future-rides" routerLinkActive="active">
      Future Rides
    </a>

    <a class="nav-link" routerLink="/driver/ride-history" routerLinkActive="active">
      Ride History
    </a>

    <a class="nav-link" routerLink="/driver/reports" routerLinkActive="active">
      Reports
    </a>
  </div>

  <div class="nav-center">
    <div class="panic-btn" routerLink="/driver/support" routerLinkActive="active-panic">
      <img src="panic.svg" alt="panic" />
    </div>
  </div>

  <div class="nav-right">
    <button class="driver-status" [class.available]="(driverAvailable$ | async)" (click)="toggleAvailability()"
      [disabled]="trackingResponse !== null">
      {{ (driverAvailable$ | async) ? 'Available' :  'Busy' }}
    </button>

    <a class="nav-link" routerLink="/driver/support" routerLinkActive="active">
      Support
    </a>

    <a class="nav-link" routerLink="/driver/profile" routerLinkActive="active">
      Profile
    </a>

    <button class="nav-link logout-btn" type="button" (click)="logout()" [disabled]="trackingResponse !== null">
      Log Out
    </button>

  </div>
</nav>
